<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f5f5f7" />
<title>Painel · Millena Curty</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/assets/admin.css?v=3" />
</head>
<body>

<div class="login" id="login" hidden>
  <form class="login__card" id="login-form" autocomplete="on">
    <div class="login__brand">Millena <em>Curty</em></div>
    <p class="login__sub">Entre para gerenciar o site.</p>
    <div class="setup" id="setup" hidden></div>
    <label class="sr-only" for="login-email">Email</label>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
    <label class="sr-only" for="login-pass">Senha</label>
    <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" required />
    <p class="login__err" id="login-err" role="alert"></p>
    <button class="btn btn--primary btn--block" type="submit" id="login-btn">Entrar</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side__brand">Millena <em>Curty</em></div>
    <nav class="side__nav" id="side-nav"></nav>
    <div class="side__foot">
      <a href="/" target="_blank" rel="noopener" class="side__link">Ver site <span aria-hidden="true">↗</span></a>
      <div class="side__user"><span id="me-email"></span><button type="button" id="logout">Sair</button></div>
    </div>
  </aside>
  <div class="side__scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="top__menu" type="button" id="menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="top__titles">
        <h1 id="view-title">Painel</h1>
        <p id="view-desc"></p>
      </div>
      <div class="top__actions" id="top-actions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/admin.js?v=3" defer></script>
</body>
</html>
